name: CI

# Aucune permission par défaut : chaque job demande ce qu'il lui faut
permissions: {}

# Exécuté sur les PR, et appelé en réutilisable par deploy.yml avant le build.
# Pas de déclencheur `push` : un push direct sur develop passe déjà par
# deploy.yml, qui appelle ce workflow — une seule source de vérité, pas de double exécution.
on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (types · tests · format · lint · audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Tests (vitest run)
        run: npx vitest run

      - name: Format (prettier --check)
        run: npx prettier . --check

      - name: Lint ratchet (eslint . vs .eslint-ratchet.json)
        run: npm run lint:ratchet

      # Dette de vulnérabilités préexistante dans l'arbre prod (3 high, 3 critical au
      # 2026-10-12, cf. docs/securite.md) : non bloquant jusqu'à résorption.
      - name: Audit (npm audit, prod scope)
        continue-on-error: true
        run: npm audit --omit=dev
