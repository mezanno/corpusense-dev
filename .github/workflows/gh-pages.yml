name: Deploy React App to GitHub Pages

# Aucune permission par défaut : chaque job demande ce qu'il lui faut
permissions: {}

on:
  push:
    branches:
      - develop

# 2. Gestion de la concurrence : annule les déploiements obsolètes et évite les race conditions
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # --- JOB 1 : BUILD  ---
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Droit de lecture uniquement sur le dépôt
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup npm
  run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # --- JOB 2 : DEPLOYMENT ---
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build # Ne s'exécute qu'après la réussite du job build
    permissions:
      pages: write      # Requis pour le déploiement Pages natif
      id-token: write   # Requis pour la vérification OIDC
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4